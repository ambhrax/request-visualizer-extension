<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <!-- Connecting line -->
  <line x1="64" y1="28" x2="64" y2="100" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <!-- Arrow head -->
  <polygon points="64,106 52,90 76,90" fill="#ffffff" />
  <!-- Top Node (Client) -->
  <circle cx="64" cy="30" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="64" cy="30" r="6" fill="#7c3aed" />
  <!-- Middle Node (DNS / Server) -->
  <circle cx="64" cy="64" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="64" cy="64" r="6" fill="#4f46e5" />
</svg>
